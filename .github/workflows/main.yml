name: CI

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Build and Deploy (GitHub Pages)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Inject TMDB key into .env
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Export web (static) and normalize output to dist
        run: |
          set -e
          # Try recommended export commands (some CLI versions differ)
          if npx expo export:web --help >/dev/null 2>&1; then
            npx expo export:web || true
          else
            npx expo export || true
          fi

          # Common output folders from different expo versions
          if [ -d dist ]; then
            echo "dist already exists"
          elif [ -d web-build ]; then
            mv web-build dist
          elif [ -d web ]; then
            mv web dist
          elif [ -d out ]; then
            mv out dist
          elif [ -d export ]; then
            mv export dist
          else
            echo "No known output folder produced by expo; listing files:" && ls -la
            exit 1
          fi

      - name: Create .nojekyll to bypass Jekyll on GitHub Pages
        run: echo > dist/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
