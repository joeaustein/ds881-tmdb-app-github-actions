name: CI

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Build and Deploy (GitHub Pages)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: npm ci

      - name: Inject TMDB key into .env
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Export web (static) and normalize output to dist
        run: |
          set -euo pipefail
          EXPORT_FAILED=false

          # Ensure node_modules exists (runner may have cleaned workspace)
          if [ ! -d node_modules ]; then
            echo "node_modules not found. Running npm ci..."
            npm ci
          fi

          echo "Attempting expo export (static)"
          # Prefer generic export which works across bundlers
          npx expo export 2>&1 || EXPORT_FAILED=true

          echo "Contents of current directory (for debug):"
          ls -la

          echo "Checking for output folders..."
          if [ -d dist ]; then
            echo "✓ Found dist directory"
          elif [ -d web-build ]; then
            echo "✓ Found web-build, moving to dist"
            mv web-build dist
          elif [ -d web ]; then
            echo "✓ Found web, moving to dist"
            mv web dist
          elif [ -d out ]; then
            echo "✓ Found out, moving to dist"
            mv out dist
          elif [ -d export ]; then
            echo "✓ Found export, moving to dist"
            mv export dist
          else
            echo "ERROR: No known output folder produced by expo"
            echo "EXPORT_FAILED=${EXPORT_FAILED}"
            ls -la
            exit 1
          fi

      - name: Create .nojekyll to bypass Jekyll on GitHub Pages
        run: echo > dist/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
