name: CI

permissions:
  contents: write
  pages: write
  id-token: write

on:
  push:
    branches:
      - release
  workflow_dispatch:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Build and Deploy (GitHub Pages)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Inject TMDB key into .env
        run: echo "EXPO_PUBLIC_TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env

      - name: Export web (static) and normalize output to dist
        run: |
          set -euo pipefail
          EXPORT_FAILED=false

          # Ensure node_modules exists (runner may have cleaned workspace)
          if [ ! -d node_modules ]; then
            echo "node_modules not found. Running npm ci..."
            npm ci
          fi

          echo "Attempting expo export (static)"
          # Prefer generic export which works across bundlers
          npx expo export 2>&1 || EXPORT_FAILED=true

          echo "Contents of current directory (for debug):"
          ls -la

          echo "Checking for output folders..."
          if [ -d dist ]; then
            echo "✓ Found dist directory"
          elif [ -d web-build ]; then
            echo "✓ Found web-build, moving to dist"
            mv web-build dist
          elif [ -d web ]; then
            echo "✓ Found web, moving to dist"
            mv web dist
          elif [ -d out ]; then
            echo "✓ Found out, moving to dist"
            mv out dist
          elif [ -d export ]; then
            echo "✓ Found export, moving to dist"
            mv export dist
          else
            echo "ERROR: No known output folder produced by expo"
            echo "EXPORT_FAILED=${EXPORT_FAILED}"
            ls -la
            exit 1
          fi

      - name: Create .nojekyll to bypass Jekyll on GitHub Pages
        run: echo > dist/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}

  android-build:
    name: Build Android APK
    needs: deploy
    runs-on: ubuntu-latest
    # Use RUNNER_TEMP inside steps to locate temporary directory on the runner
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Install Android commandline tools
        run: |
          set -e
          ANDROID_SDK_ROOT="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          cd "$ANDROID_SDK_ROOT"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
          unzip -q cmdline.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest || true
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Expo prebuild (generate android folder)
        run: npx expo prebuild --platform android

      - name: Setup Android signing (if secrets provided)
        run: |
          set -e
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Writing keystore to android/app/my-release-key.keystore"
            mkdir -p android/app
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.keystore
            chmod 600 android/app/my-release-key.keystore
            mkdir -p ~/.gradle
            printf '%s\n' \
              "MYAPP_UPLOAD_STORE_FILE=app/my-release-key.keystore" \
              "MYAPP_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" \
              "MYAPP_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
              "MYAPP_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" \
              > ~/.gradle/gradle.properties
            echo "Gradle properties written"
          else
            echo "ANDROID_KEYSTORE_BASE64 not set — skipping keystore setup (APK will be unsigned)"
          fi

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        run: |
          set -e
          ./gradlew assembleRelease --no-daemon --max-workers=$(nproc)
          echo "Post-build: listing APK/AAB files inside android project for diagnostics"
          find . -type f -name "*.apk" -print || true
          find . -type f -name "*.aab" -print || true

      - name: Find APK
        id: find_apk
        run: |
          set -euxo pipefail
          echo "Listing android build outputs for debugging:"
          find android -maxdepth 6 -type d -name outputs -print || true
          echo "Full tree under android/app/build/outputs (if exists):"
          if [ -d android/app/build/outputs ]; then
            ls -laR android/app/build/outputs || true
          else
            echo "No android/app/build/outputs directory found"
          fi
          # Try focused search first, then fall back to broader patterns
          APK_PATH=$(find android -type f \( -path "*/outputs/apk/*/release/*.apk" -o -path "*/outputs/apk/*/*/release/*.apk" -o -name "*release*.apk" -o -name "*.apk" -o -name "*.aab" \) | head -n 1 || true)
          if [ -z "$APK_PATH" ]; then
            echo "No artifact found with primary search, trying broader search..."
            APK_PATH=$(find android -type f -name "*.apk" -o -name "*.aab" | head -n 1 || true)
          fi
          echo "Discovered artifact path: '$APK_PATH'"
          if [ -z "$APK_PATH" ]; then
            echo "No APK/AAB found under android. Listing any apk/aab files for debug:"
            find android -type f \( -name "*.apk" -o -name "*.aab" \) -print || true
          fi
          echo "apk=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Validate APK exists
        run: |
          echo "Validate step running — apk output: '${{ steps.find_apk.outputs.apk }}'"
          if [ -z "${{ steps.find_apk.outputs.apk }}" ]; then
            echo "ERROR: find_apk returned empty — build likely failed to produce an APK"
            echo "Show android directory listing for extra context:"
            ls -la android || true
            exit 1
          fi
          if [ ! -f "${{ steps.find_apk.outputs.apk }}" ]; then
            echo "ERROR: APK file not found at path: ${{ steps.find_apk.outputs.apk }}"
            exit 1
          fi

      - name: Upload APK artifact
        if: steps.find_apk.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: ${{ steps.find_apk.outputs.apk }}

      - name: Create GitHub Release and upload APK
        if: steps.find_apk.outputs.apk != ''
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.run_number }}
          files: ${{ steps.find_apk.outputs.apk }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Release via API
        if: steps.find_apk.outputs.apk != ''
        run: |
          echo "Checking release v${{ github.run_number }}"
          resp=$(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ github.run_number }} || true)
          echo "$resp" | head -n 200

      - name: Attach APK to Release (fallback via API)
        if: steps.find_apk.outputs.apk != ''
        run: |
          set -euo pipefail
          APK_PATH="${{ steps.find_apk.outputs.apk }}"
          echo "Checking release v${{ github.run_number }} and uploading $APK_PATH if missing"
          resp=$(curl -sS -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" https://api.github.com/repos/${{ github.repository }}/releases/tags/v${{ github.run_number }} || true)
          echo "Release JSON (first 200 chars):"
          echo "$resp" | head -c 200
          # parse upload_url from release JSON using jq (safer for YAML multiline)
          if command -v jq >/dev/null 2>&1; then
            upload_url=$(echo "$resp" | jq -r '.upload_url // empty' | sed 's/{?name,label}//')
          else
            upload_url=$(echo "$resp" | python -c "import sys,json; data=json.load(sys.stdin); u=data.get('upload_url',''); print(u.replace('{?name,label}',''))" )
          fi
          if [ -z "$upload_url" ]; then
            echo "No upload_url found in release JSON; aborting fallback upload"
            exit 0
          fi
          filename=$(basename "$APK_PATH")
          echo "Uploading $filename to $upload_url"
          curl -sS -X POST -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -H "Content-Type: application/octet-stream" --data-binary @"$APK_PATH" "$upload_url?name=$filename" | head -n 200 || true
